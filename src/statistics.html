<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yomiki - Statistics</title>
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/library.css">
  <link rel="stylesheet" href="styles/reader.css">
  <link rel="stylesheet" href="styles/studio.css">
  <link rel="stylesheet" href="styles/modal.css">
  <link rel="stylesheet" href="styles/stats.css">
  <link rel="stylesheet" href="styles/settings.css">
  <link rel="stylesheet" href="styles/dev.css">
  <link rel="stylesheet" href="styles/statistics.css">
  <script>
    (function(){
      const s = JSON.parse(localStorage.getItem('Yomiki_settings') || '{}');
      const t = s.theme || localStorage.getItem('Yomiki_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
      const scale = s.ui_scale || 100;
      document.documentElement.setAttribute('data-ui-scale', Math.round(scale));
      const anim = s.disable_animations ? 'false' : 'true';
      document.documentElement.setAttribute('data-animations', anim);
    })();
  </script>
<base target="_blank">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </div>
        <span class="brand-text">Yomiki</span>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-group">
          <button class="nav-item" data-filter="all">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span>Library</span>
          </button>
          <button class="nav-item" data-filter="favorites">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span>Favorites</span>
          </button>
          <button class="nav-item" data-filter="bookmarks">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            <span>Reading</span>
          </button>
          <button class="nav-item" data-filter="completed">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            <span>Completed</span>
          </button>
          <button class="nav-item" data-filter="collection">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span>Collections</span>
          </button>
        </div>

        <div class="nav-divider"></div>

        <div class="nav-group">
          <button class="nav-item active" data-view="stats">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>Statistics</span>
          </button>
          <button class="nav-item" data-view="studio">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
            <span>Studio</span>
          </button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button id="btn-import" class="footer-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>Import Manga</span>
        </button>
        <button id="btn-scan" class="footer-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="11"/><line x1="8" y1="11" x2="8" y2="11"/><line x1="16" y1="11" x2="16" y2="11"/></svg>
          <span>Scan Folder</span>
        </button>
        <div class="nav-divider"></div>
        <button class="nav-item" data-view="settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.67 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="content-header">
        <h1 class="page-title" style="display:flex;align-items:center;gap:0.6rem;">
          Statistics
        </h1> 
      </div>

      <div class="stats-dashboard">
        <!-- Hero Stat -->
        <div class="stats-hero">
          <div class="stats-hero-main">
            <div class="stats-hero-label">Library Completion</div>
            <div class="stats-hero-value" id="hero-completion">0%</div>
            <div class="stats-hero-bar">
              <div class="stats-hero-fill" id="hero-fill" style="width:0%"></div>
            </div>
          </div>
          <div class="stats-hero-meta">
            <div class="hero-meta-item">
              <div class="hero-meta-value" id="hero-total">0</div>
              <div class="hero-meta-label">Total Manga</div>
            </div>
            <div class="hero-meta-divider"></div>
            <div class="hero-meta-item">
              <div class="hero-meta-value" id="hero-read">0</div>
              <div class="hero-meta-label">In Progress</div>
            </div>
            <div class="hero-meta-divider"></div>
            <div class="hero-meta-item">
              <div class="hero-meta-value" id="hero-done">0</div>
              <div class="hero-meta-label">Completed</div>
            </div>
          </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid-layout">
          <!-- Reading Activity -->
          <div class="stats-card wide">
            <div class="stats-card-header">
              <h3>Reading Activity</h3>
              <div class="stats-period">
                <button class="period-btn active" data-period="week">7 Days</button>
                <button class="period-btn" data-period="month">30 Days</button>
              </div>
            </div>
            <div class="stats-chart-area" id="activity-chart">
              <canvas id="activity-canvas"></canvas>
            </div>
            <div class="stats-chart-legend">
              <div class="legend-item">
                <span class="legend-dot" style="background:var(--accent)"></span>
                <span>Pages Read</span>
              </div>
            </div>
          </div>

          <!-- Genre Breakdown -->
          <div class="stats-card">
            <div class="stats-card-header">
              <h3>Genre Breakdown</h3>
            </div>
            <div class="stats-donut-area">
              <canvas id="genre-canvas"></canvas>
              <div class="donut-center" id="genre-center">
                <div class="donut-value">0</div>
                <div class="donut-label">Genres</div>
              </div>
            </div>
            <div class="stats-legend-list" id="genre-legend"></div>
          </div>

          <!-- Status Distribution -->
          <div class="stats-card">
            <div class="stats-card-header">
              <h3>Status</h3>
            </div>
            <div class="stats-bars-area" id="status-bars"></div>
          </div>

          <!-- Reading Time -->
          <div class="stats-card wide">
            <div class="stats-card-header">
              <h3>Reading Time</h3>
            </div>
            <div class="stats-time-display">
              <div class="time-main" id="time-total">0h 0m</div>
              <div class="time-sub">Total time spent reading</div>
            </div>
            <div class="stats-time-breakdown" id="time-breakdown"></div>
          </div>

          <!-- Top Manga -->
          <div class="stats-card full-width">
            <div class="stats-card-header">
              <h3>Most Read</h3>
            </div>
            <div class="stats-manga-list" id="top-manga"></div>
          </div>

          <!-- Quick Stats Row -->
          <div class="stats-mini-row">
            <div class="stats-mini-card">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
              <div class="mini-value" id="mini-chapters">0</div>
              <div class="mini-label">Chapters</div>
            </div>
            <div class="stats-mini-card">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
              <div class="mini-value" id="mini-pages">0</div>
              <div class="mini-label">Total Pages</div>
            </div>
            <div class="stats-mini-card">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              <div class="mini-value" id="mini-fav">0</div>
              <div class="mini-label">Favorites</div>
            </div>
            <div class="stats-mini-card">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
              <div class="mini-value" id="mini-collections">0</div>
              <div class="mini-label">Collections</div>
            </div>
            <div class="stats-mini-card highlight">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
              <div class="mini-value" id="mini-streak">0</div>
              <div class="mini-label">Day Streak</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="./script/utils.js"></script>
  <script src="./script/statistics.js"></script>
  <script src="./script/dev.js"></script>
</body>
</html>
